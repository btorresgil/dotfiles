source-file ~/.config/tmux/tmux.reset.conf

# For true color (24-bit) support
set-option -g default-terminal 'screen-256color'

# Set prefix to Ctrl-A
set -g prefix ^A

set -g mouse on

set -g base-index 1              # start indexing windows at 1 instead of 0
#set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed

set -g visual-activity off
setw -g monitor-activity off

# For Claude Code (https://code.claude.com/docs/en/terminal-config#configure-tmux)
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g set-clipboard on          # use system clipboard
set -g status-position top       # macOS / darwin style
set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set -g automatic-rename off


set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# set -g @floax-width '80%'
# set -g @floax-height '80%'
# set -g @floax-border-color 'magenta'
# set -g @floax-text-color 'blue'
# set -g @floax-bind 'p'
# set -g @floax-change-path 'true'
set -g @sessionx-bind-zo-new-window 'ctrl-y'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
set -g @sessionx-bind 'o'
set -g @sessionx-x-path '~/dotfiles'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'off'
set -g @sessionx-custom-paths-subdirectories 'false'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-mode 'on'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

bind C-j display-popup -E 'tmux list-session | cat'
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
#bind C-j display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
bind C-z display-popup \
  -w 80% \
  -h 80% \
  -E 'nvim ~/.zshrc'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right ""
#set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
#set -agF status-right "#{E:@catppuccin_status_cpu}"
#set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{@catppuccin_status_gitmux}"
#set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
#set -agF status-right "#{E:@catppuccin_status_load}"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
#set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_status "no"
set -g @catppuccin_window_default_fill "number"
#set -g @catppuccin_window_text " #W: #{pane_current_command}"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_fill "number"
#set -g @catppuccin_window_current_text " #W: #{pane_current_command}"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_modules_right "directory" # date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
#set -g @catppuccin_directory_text "#{b:pane_current_path}"

# For Claude Code idle/permissions status
set -g @catppuccin_window_number_color '#{?#{==:#{@claude_state},idle},#{@thm_green},#{?#{==:#{@claude_state},permission},#{@thm_red},#{?#{==:#{@claude_state},thinking},#{@thm_blue},#{@thm_overlay_1}}}}'
set -g @catppuccin_window_current_number_color '#{?#{==:#{@claude_state},idle},#{@thm_green},#{?#{==:#{@claude_state},permission},#{@thm_red},#{?#{==:#{@claude_state},thinking},#{@thm_blue},#{@thm_peach}}}}'
#set -g status-interval 1
#set -g @catppuccin_window_text ' #{?#{==:#{@claude_state},thinking},🌀 ,#{?#{==:#{@claude_state},permission},🔶 ,#{?#{==:#{@claude_state},idle},🟢 ,}}}#W'
#set -g @catppuccin_window_current_text ' #{?#{==:#{@claude_state},thinking},🌀 ,#{?#{==:#{@claude_state},permission},🔶 ,#{?#{==:#{@claude_state},idle},🟢 ,}}}#W'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux'
#set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'omerxx/tmux-floax'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
